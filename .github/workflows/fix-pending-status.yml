name: Fix Pending Status (일회성)

on:
  workflow_dispatch:

jobs:
  fix-pending:
    runs-on: ubuntu-22.04
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install firebase-admin

      - name: Firebase 키 파일 생성
        run: |
          mkdir -p backend/config
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > backend/config/firebase-credentials.json

      - name: pending → rejected 업데이트
        run: |
          python - << 'PYEOF'
          import firebase_admin
          from firebase_admin import credentials, firestore

          cred = credentials.Certificate('backend/config/firebase-credentials.json')
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          docs = db.collection('announcements').where('status', '==', 'pending').stream()
          count = 0
          for doc in docs:
              doc.reference.update({'status': 'rejected'})
              count += 1
              print(f'  업데이트: {doc.id}')

          print(f'\n✅ 완료: {count}개 업데이트')
          PYEOF
