name: OCI ARM 인스턴스 자동 생성

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 생성 시도
  workflow_dispatch:          # 수동 실행 버튼

jobs:
  create-instance:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: OCI SDK 설치
        run: pip install oci

      - name: ARM 인스턴스 생성 시도
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          python3 << 'PYEOF'
          import oci
          import oci.compute
          import oci.compute.models
          import oci.exceptions
          import os
          import sys

          config = {
              "user":        os.environ["OCI_USER_ID"],
              "fingerprint": os.environ["OCI_FINGERPRINT"],
              "tenancy":     os.environ["OCI_TENANCY_ID"],
              "region":      "ap-chuncheon-1",
              "key_content": os.environ["OCI_PRIVATE_KEY"],
          }

          compute = oci.compute.ComputeClient(config)

          details = oci.compute.models.LaunchInstanceDetails(
              availability_domain = "dmxW:AP-CHUNCHEON-1-AD-1",
              compartment_id      = os.environ["OCI_TENANCY_ID"],
              display_name        = "eap-runner",
              shape               = "VM.Standard.A1.Flex",
              shape_config        = oci.compute.models.LaunchInstanceShapeConfigDetails(
                  ocpus          = 1,
                  memory_in_gbs  = 6,
              ),
              source_details      = oci.compute.models.InstanceSourceViaImageDetails(
                  image_id    = os.environ["OCI_IMAGE_ID"],
                  source_type = "image",
              ),
              create_vnic_details = oci.compute.models.CreateVnicDetails(
                  subnet_id         = os.environ["OCI_SUBNET_ID"],
                  assign_public_ip  = True,
              ),
              metadata = {
                  "ssh_authorized_keys": os.environ["OCI_SSH_PUBLIC_KEY"],
              },
          )

          try:
              resp = compute.launch_instance(details)
              print(f"✅ 인스턴스 생성 성공! ID: {resp.data.id}")
              sys.exit(0)
          except oci.exceptions.ServiceError as e:
              msg = e.message or ""
              if e.status == 500 and ("Out of host capacity" in msg or "Out of capacity" in msg):
                  print("⚠️  용량 부족 - 30분 후 자동 재시도")
                  sys.exit(0)
              print(f"❌ 오류: [{e.status}] {e.code} - {msg}")
              sys.exit(1)
          PYEOF
