name: Daily Report (자동)

on:
  schedule:
    - cron: '0 8 * * *'   # 매일 08:00 UTC = 17:00 KST
  workflow_dispatch:       # 수동 실행 버튼 (테스트용)
    inputs:
      skip_vpn:
        description: 'VPN 없이 실행 (롤백용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  daily-report:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: Playwright 브라우저 설치
        run: python -m playwright install chromium --with-deps

      - name: VPN Gate 한국 서버 연결
        if: ${{ github.event.inputs.skip_vpn != 'true' }}
        run: |
          sudo apt-get install -y openvpn curl

          # VPN Gate API에서 한국 서버 목록 조회 (속도 기준 상위 3개 시도)
          CSV=$(curl -s 'https://www.vpngate.net/api/iphone/' | grep -v '^#' | grep ',KR,')
          SERVERS=$(echo "$CSV" | awk -F',' '{print NR, $5, $NF}' | sort -k2 -nr | head -3 | awk '{print $1, $NF}')

          echo "vpn" > /tmp/vpn_creds.txt
          echo "vpn" >> /tmp/vpn_creds.txt

          CONNECTED=false
          while IFS=' ' read -r idx config_b64; do
            echo "$config_b64" | base64 -d > /tmp/korea.ovpn
            sudo openvpn --config /tmp/korea.ovpn \
              --auth-user-pass /tmp/vpn_creds.txt \
              --daemon --log /tmp/vpn.log
            sleep 15
            CURRENT_IP=$(curl -s --max-time 10 ifconfig.me || echo "")
            if [ -n "$CURRENT_IP" ]; then
              echo "✅ VPN 연결 성공: $CURRENT_IP"
              CONNECTED=true
              break
            fi
            echo "⚠️ 서버 $idx 실패, 다음 서버 시도..."
            sudo pkill openvpn || true
            sleep 3
          done <<< "$SERVERS"

          if [ "$CONNECTED" = false ]; then
            echo "❌ 한국 VPN 서버 연결 실패"
            exit 1
          fi

      - name: Firebase 키 파일 생성
        run: |
          mkdir -p backend/config
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > backend/config/firebase-credentials.json

      - name: 일일 리포트 실행
        run: python -m backend.entrypoints.daily_report --auto
        env:
          FIREBASE_CREDENTIALS_PATH: backend/config/firebase-credentials.json
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C034EQD6W4W
          SLACK_EAP_USERGROUP: S08SE5ZTPQD
          FRONTEND_URL: https://eap-intern-roni.web.app

      - name: VPN 연결 해제
        if: always()
        run: sudo pkill openvpn || true
