name: Daily Report (자동)

on:
  schedule:
    - cron: '30 8 * * 1-5'  # 평일(월~금) 08:30 UTC = 17:30 KST
  workflow_dispatch:       # 수동 실행 버튼 (테스트용)
    inputs:
      slack_channel:
        description: 'Slack 전송 채널 | C071ZL69JQZ = 테스트 채널 / C034EQD6W4W = 공식 채널(EAP파트)'
        required: false
        default: 'C071ZL69JQZ'
        type: choice
        options:
          - 'C071ZL69JQZ'
          - 'C034EQD6W4W'
      skip_vpn:
        description: 'VPN 없이 실행 (롤백용)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  daily-report:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r backend/requirements.txt

      - name: Playwright 브라우저 설치
        run: python -m playwright install chromium --with-deps

      - name: VPN Gate 한국 서버 연결
        if: ${{ github.event.inputs.skip_vpn != 'true' }}
        run: |
          sudo apt-get install -y openvpn curl

          # 한국 서버 목록을 임시 파일에 저장 (파이프 Broken pipe 방지)
          TMPFILE=$(mktemp)
          curl -s 'https://www.vpngate.net/api/iphone/' \
            | grep -v '^#' \
            | grep ',KR,' \
            | sort -t',' -k5 -nr \
            | head -3 > "$TMPFILE" || true

          if [ ! -s "$TMPFILE" ]; then
            echo "❌ 한국 VPN 서버를 찾을 수 없음"
            exit 1
          fi

          echo "vpn" > /tmp/vpn_creds.txt
          echo "vpn" >> /tmp/vpn_creds.txt

          CONNECTED=false
          while IFS= read -r line; do
            IP=$(echo "$line" | awk -F',' '{print $2}')
            CONFIG_B64=$(echo "$line" | awk -F',' '{print $NF}' | tr -d '\r\n')

            if [ -z "$CONFIG_B64" ]; then
              continue
            fi

            echo "서버 시도: $IP"
            printf '%s' "$CONFIG_B64" | base64 -d > /tmp/korea.ovpn 2>/dev/null \
              || { echo "  base64 디코딩 실패, 건너뜀"; continue; }

            # 모든 트래픽을 VPN으로 강제 라우팅
            echo "redirect-gateway def1 bypass-dhcp" >> /tmp/korea.ovpn

            sudo openvpn --config /tmp/korea.ovpn \
              --auth-user-pass /tmp/vpn_creds.txt \
              --daemon --log /tmp/vpn.log
            sleep 20

            # 한국 IP 여부 확인
            COUNTRY=$(curl -s --max-time 10 https://ipinfo.io/country || echo "")
            CURRENT_IP=$(curl -s --max-time 10 ifconfig.me || echo "")
            if [ "$COUNTRY" = "KR" ]; then
              echo "✅ 한국 IP 확인: $CURRENT_IP (서버: $IP)"
              CONNECTED=true
              break
            else
              echo "⚠️ 한국 IP 아님 (현재: $COUNTRY / $CURRENT_IP), 다음 서버 시도..."
            fi

            echo "⚠️ $IP 연결 실패, 다음 서버 시도..."
            sudo pkill openvpn || true
            sleep 3
          done < "$TMPFILE"

          rm -f "$TMPFILE"

          if [ "$CONNECTED" = false ]; then
            echo "❌ 한국 VPN 서버 연결 실패"
            exit 1
          fi

      - name: SOCKS5 로컬 프록시 시작 (Playwright VPN 라우팅용)
        if: ${{ github.event.inputs.skip_vpn != 'true' }}
        run: |
          pip install pproxy -q
          nohup python3 -m pproxy -l socks5://:1080 > /tmp/pproxy.log 2>&1 &
          sleep 3
          echo "✅ SOCKS5 프록시 시작 (포트 1080)"

      - name: Firebase 키 파일 생성
        run: |
          mkdir -p backend/config
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > backend/config/firebase-credentials.json

      - name: 일일 리포트 실행
        run: python -u -m backend.entrypoints.daily_report --auto
        env:
          PYTHONUNBUFFERED: "1"
          AUTO_CONFIRM: "1"
          FIREBASE_CREDENTIALS_PATH: backend/config/firebase-credentials.json
          PLAYWRIGHT_PROXY_SERVER: ${{ github.event.inputs.skip_vpn == 'true' && '' || 'socks5://127.0.0.1:1080' }}
          PLAYWRIGHT_WAIT_UNTIL: "load"
          PLAYWRIGHT_TIMEOUT: "60000"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ github.event.inputs.slack_channel || 'C034EQD6W4W' }}
          SLACK_EAP_USERGROUP: S08SE5ZTPQD
          FRONTEND_URL: https://eap-intern-roni.web.app

      - name: VPN 연결 해제
        if: always()
        run: sudo pkill openvpn || true
